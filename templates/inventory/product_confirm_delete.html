{% extends 'base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="bg-white rounded-xl border border-gray-200 px-6 py-8 text-center">
    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-6 h-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
    </div>
    <h2 class="text-lg font-bold text-gray-900 mb-2">Delete Product</h2>
    <p class="text-gray-600 text-sm mb-6">
      Are you sure you want to delete <strong>{{ object.name }}</strong>?
      This action cannot be undone.
    </p>
    <div class="flex gap-3 justify-center">
      <form method="post">
        {% csrf_token %}
        <button type="submit"
                class="bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2.5 rounded-lg text-sm transition-colors">
          Delete
        </button>
      </form>
      <a href="{% url 'inventory:product-list' %}"
         class="border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium px-5 py-2.5 rounded-lg text-sm transition-colors">
        Cancel
      </a>
    </div>
  </div>
</div>
{% endblock %}
