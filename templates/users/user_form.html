{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ action }} User{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{% url 'users:list' %}"
       class="text-gray-400 hover:text-gray-600 transition-colors">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <h1 class="text-xl font-bold text-gray-900">{{ action }} User</h1>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 px-6 py-6">
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="flex gap-3 mt-6 pt-4 border-t border-gray-100">
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-lg text-sm transition-colors">
          Save User
        </button>
        <a href="{% url 'users:list' %}"
           class="border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium px-5 py-2.5 rounded-lg text-sm transition-colors">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
